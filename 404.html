<script>
// GitHub Pages serves this file for any unknown path. Old Adobe Portfolio addresses
// (/work, /001-people, /about-me, /homepage) are sent to the matching page of the new site.
(function () {
  var p = location.pathname.replace(/^\/+|\/+$/g, '').toLowerCase();
  var known = ['work', 'about-me', '001-people', '002-places', '003-things', '004-music',
               '005-art', '006-sports', '007-birds', '008-animals'];
  var hash = p === 'homepage' || p === '' ? '' : (known.indexOf(p) > -1 ? '#' + p : '#work');
  location.replace('/' + hash);
})();
</script>
