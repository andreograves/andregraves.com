<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>André | Portfolio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="André O. Graves, photographer. People, Places, Things.">
<meta property="og:title" content="André | Portfolio">
<meta property="og:description" content="People, Places, Things. Photography by André O. Graves.">
<meta property="og:url" content="https://andregraves.com/">
<meta property="og:type" content="website">
<link rel="icon" href="favicon.ico?v=camera3" sizes="48x48">
<link rel="icon" href="img/favicon.svg?v=camera3" type="image/svg+xml">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png?v=camera3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap">
<style>
/* Mirrors the live Adobe Portfolio site (theme "Jess"): white walls, distressed typewriter type,
   edge-to-edge grayscale covers, justified photo rows, round social buttons. Single light look by design. */
:root{
  --bg:#fff;        /* page */
  --ink:#111;       /* page titles */
  --masthead:#222;  /* masthead line 1 */
  --ghost:#8d8d8d;  /* masthead line 2 */
  --nav:#aaa;       /* nav links at rest */
  --chip:#eee;      /* social button fill */
  --chip-ink:#6b6b6b;
  --sub:#c0c6cc;    /* splash subtitle */
  --white:#fff;
  /* Live site uses Adobe Fonts "Typeka"; Special Elite is the closest free face. */
  --type:'Typeka','Special Elite','American Typewriter','Courier New',Courier,monospace;
  --gutter:48px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;overflow-x:hidden;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--type);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid currentColor;outline-offset:3px}
@media (max-width:768px){:root{--gutter:16px}}

.view{animation:fade .35s ease}
@keyframes fade{from{opacity:.001}to{opacity:1}}

/* Splash (live homepage) */
.splash{position:relative;min-height:100svh;display:grid;place-items:center;text-align:center;background:#000 url(img/splash.jpg) 0% 50%/cover no-repeat;color:var(--white);
  padding-block:70px 180px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.splash h1{margin:0;font-weight:400;font-size:clamp(34px,4.2vw,60px);line-height:1.1;letter-spacing:.01em}
.splash a{display:inline-block;margin-top:.15em;font-size:clamp(18px,1.95vw,28px);color:var(--sub);transition:color .2s}
.splash a:hover{color:var(--white)}

/* Header / nav */
.site-header{position:relative;z-index:5;padding-block:14px 60px;text-align:center}
.pages{display:flex;justify-content:center;gap:35px}
.pages a{font-size:16px;line-height:16px;text-transform:uppercase;color:var(--nav);transition:color .2s}
.pages a:hover,.pages a.active{color:#000}
.burger{display:none}
.menu{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px}
.menu a{font-size:28px;text-transform:uppercase;color:#000}
.menu .gal{display:grid;grid-template-columns:1fr 1fr;gap:14px 32px;text-align:center}
.menu .gal a{font-size:18px;color:#555}
.menu .close{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));background:none;border:0;font-size:40px;line-height:1;cursor:pointer;color:#000}
@media (max-width:768px){
  .site-header{padding-block:20px 40px;text-align:right;padding-right:max(16px,env(safe-area-inset-right,0px))}
  .pages{display:none}
  .burger{display:inline-flex;flex-direction:column;gap:6px;background:none;border:0;padding:6px;cursor:pointer}
  .burger i{display:block;width:26px;height:2px;background:#000}
  .on-photo .burger i{background:var(--white)}
}

.wrap{padding-left:max(var(--gutter),env(safe-area-inset-left,0px));padding-right:max(var(--gutter),env(safe-area-inset-right,0px))}

/* Masthead: three offset lines, as on the live Portfolio page */
.masthead{width:min(800px,100%);margin:0 auto;padding-bottom:40px;font-size:clamp(28px,4.9vw,70px);line-height:.72}
.masthead div{white-space:nowrap}
.masthead .m1{text-align:right;color:var(--masthead)}
.masthead .m2{text-align:left;color:var(--ghost);margin-top:.05em}
.masthead .m3{text-align:center;color:#000;margin-top:-.05em}
@media (max-width:768px){.masthead{padding-bottom:50px}}

/* Cover grid */
.covers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
@media (max-width:768px){.covers{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:540px){.covers{grid-template-columns:1fr}}
.cover{position:relative;display:block;aspect-ratio:457/350;max-width:100%;overflow:hidden;background:#222}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1);opacity:0;transition:opacity 1.4s ease,filter .6s ease}
.cover img.on{opacity:1}
.cover:hover img,.cover:focus-visible img{filter:grayscale(0)}
.cover::after{content:"";position:absolute;inset:0;background:#000;opacity:0;transition:opacity .3s}
.cover span{position:absolute;inset:0;z-index:1;display:grid;place-items:center;text-align:center;padding:0 10%;color:var(--white);font-size:clamp(34px,4.9vw,70px);line-height:1.05;opacity:0;transition:opacity .15s}
.cover:hover::after,.cover:focus-visible::after{opacity:.22}
.cover:hover span,.cover:focus-visible span{opacity:1}

/* Previous / all / next, under each gallery */
.pager{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:16px;padding-block:24px 0}
.pager a{display:flex;flex-direction:column;gap:6px;color:#000;transition:color .2s}
.pager a:hover{color:var(--nav)}
.pager small{font-size:12px;letter-spacing:.14em;color:var(--nav)}
.pager b{font-weight:400;font-size:clamp(20px,2vw,28px);line-height:1}
.pager .all{align-items:center;font-size:14px;letter-spacing:.1em;padding-bottom:4px}
.pager .nx{align-items:flex-end;text-align:right}
.on-photo .pager a{color:var(--white)}
.on-photo .pager a:hover{color:var(--sub)}
@media (max-width:540px){.pager{grid-template-columns:1fr 1fr}.pager .all{grid-column:1/-1;order:3;padding-top:20px}}

/* Gallery page */
.page-header{width:min(800px,100%);margin:0 auto;padding-block:20px 70px;text-align:center}
.page-header h1{margin:0;font-weight:400;font-size:clamp(40px,4.2vw,60px);line-height:1.07;color:var(--ink);text-wrap:balance}
@media (max-width:768px){.page-header{padding-block:10px 40px}}
.rows{padding-bottom:16px}
.row{display:flex}
.row button{display:block;flex:0 0 auto;padding:0;border:0;background:#eee;cursor:zoom-in;overflow:hidden}
.row img{width:100%;height:100%;object-fit:cover}

/* About page */
.about-page{position:relative;z-index:0;min-height:100svh;color:var(--white)}
.about-page::before{content:"";position:fixed;inset:0;z-index:-1;background:#222 url(img/about-bg.jpg) center/cover no-repeat}
@media (max-width:768px){.about-page::before{background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.5)),#222 url(img/about-bg.jpg) center/cover no-repeat}}
@media (min-width:769px){.about-page::before{background:#080707 url(img/about-bg-wide.jpg) center/cover no-repeat}}
.about-page .site-header .pages a{color:rgba(255,255,255,.7)}
.about-page .site-header .pages a:hover,.about-page .site-header .pages a.active{color:var(--white)}
.about-text{width:min(800px,100%);margin-left:auto;margin-right:max(0px,calc(50vw - 670px));padding-block:100px 200px}
.about-text h1{margin:0 0 150px;font-weight:400;font-size:clamp(44px,6.4vw,92px);line-height:1}
.about-text p+p{margin-top:1.1em}
.about-text p{margin:0;font-size:clamp(18px,1.55vw,22px);line-height:1.38;max-width:34em;text-shadow:0 1px 8px rgba(0,0,0,.35)}
@media (max-width:768px){.about-text{padding-block:40px 120px}.about-text h1{margin-bottom:60px}}

/* Postmarks behind the About page content. */
.postmarks{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.about-page>.site-header,.about-page>.wrap{position:relative;z-index:1}
.pm{position:absolute;width:calc(clamp(120px,15vw,230px) * var(--s));height:auto;transform:translate(-8%,-10%) rotate(var(--r));opacity:.42;fill:none;stroke-width:2.6;font-family:var(--type);overflow:visible}
.pm text{fill:currentColor;stroke:none;letter-spacing:.06em;font-weight:700}
.pm circle,.pm-bars path,.pm-pp rect,.pm-pp ellipse{stroke:currentColor}
.pm-bars path{stroke-width:2}
.pm-c{color:#f1e7d0}
.pm-r{color:#ff6b5e;opacity:.55}
.pm-b{color:#8cc4ff;opacity:.52}
.pm-g{color:#7fe0a8;opacity:.5}
.pm-p{color:#c9a3ff;opacity:.5}
.pm-pp{width:calc(clamp(120px,14vw,210px) * var(--s))}
.pm-st{width:calc(clamp(70px,8vw,120px) * var(--s));opacity:.3}
.pm-st .st-paper{fill:#efe6d2;stroke:none}
.pm-st .st-panel{fill:none;stroke:currentColor;stroke-width:1.5}
.pm-st .st-ink{fill:#2a2522;font-weight:700}
.pm-st .st-cancel path{stroke:#2a2522;stroke-width:1.6;opacity:.7}
.pm-st.pm-c{color:#8a6d4a}
@media (max-width:700px){.pm{width:calc(96px * var(--s));opacity:.3}.pm-r,.pm-b,.pm-g,.pm-p{opacity:.4}.pm-st{width:calc(58px * var(--s));opacity:.26}}

/* Footer */
.site-footer{padding-block:60px 22px;display:flex;justify-content:center;gap:15px}
.site-footer a{display:grid;place-items:center;width:45px;height:45px;border-radius:50%;background:var(--chip);color:var(--chip-ink);transition:background .2s,color .2s}
.site-footer a:hover{background:#ddd;color:#000}
.site-footer svg{width:30px;height:24px;fill:currentColor}

/* Lightbox: white, as on the live site */
.lb{position:fixed;inset:0;z-index:60;background:rgba(255,255,255,.96);display:flex;align-items:center;justify-content:center;
  padding:calc(50px + env(safe-area-inset-top,0px)) max(56px,env(safe-area-inset-right,0px)) calc(50px + env(safe-area-inset-bottom,0px)) max(56px,env(safe-area-inset-left,0px))}
.lb img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
.lb button{position:absolute;background:none;border:0;color:#111;font-size:34px;line-height:1;cursor:pointer;padding:12px 16px;font-family:system-ui,sans-serif;font-weight:200}
.lb .x{top:calc(4px + env(safe-area-inset-top,0px));right:max(4px,env(safe-area-inset-right,0px))}
.lb .pv{left:max(0px,env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%)}
.lb .nx{right:max(0px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%)}
.lb .cp{top:calc(10px + env(safe-area-inset-top,0px));left:max(8px,env(safe-area-inset-left,0px));font-family:var(--type);font-size:12px;letter-spacing:.14em;font-weight:400;padding:10px 12px;color:#555}
.lb .cp:hover{color:#000}
.lb .cpurl{position:absolute;top:calc(52px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));width:min(420px,calc(100vw - 32px));font:13px var(--type);padding:8px 10px;border:1px solid #ccc;background:#fff;color:#111}
.lb .ct{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:13px;color:#888}
@media (max-width:540px){.lb{padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}.lb .pv,.lb .nx{top:auto;bottom:calc(2px + env(safe-area-inset-bottom,0px));transform:none}}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Music: compact masthead and edge-to-edge photographic contact sheet. */
.music-view .music-header{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:32px;padding:24px 5%;font-size:12px}
.music-brand{font-size:22px;letter-spacing:.04em;line-height:1.1}
.music-header nav{display:flex;gap:28px;align-items:center}
.music-header nav a{font-size:11px;letter-spacing:.05em}
.music-header nav a:hover{text-decoration:underline;text-underline-offset:5px}
/* Highlighter swipe behind the current gallery's name, a different color per gallery. */
.music-view{--hl:#ffe94d}
.music-view[data-g="people"]{--hl:#ffe94d}
.music-view[data-g="places"]{--hl:#7fd8ff}
.music-view[data-g="things"]{--hl:#ff8fc7}
.music-view[data-g="music"]{--hl:#ffb04d}
.music-view[data-g="art"]{--hl:#c4a3ff}
.music-view[data-g="sports"]{--hl:#8ef07c}
.music-view[data-g="birds"]{--hl:#6ff0d6}
.music-view[data-g="animals"]{--hl:#ff8a7a}
.music-header nav a[aria-current]{position:relative;isolation:isolate}
.music-header nav a[aria-current]::before{content:"";position:absolute;left:-7px;right:-9px;top:50%;height:1.45em;z-index:-1;transform:translateY(-48%) rotate(-2.5deg) skewX(-12deg);background:var(--hl);opacity:.78;mix-blend-mode:multiply;-webkit-mask:var(--swipe) center/100% 100% no-repeat;mask:var(--swipe) center/100% 100% no-repeat;pointer-events:none}
/* Hover: the same swipe, in the gallery's color, sweeps in under any text link. */
.music-view .music-brand,.music-header nav a,.music-view .pager b,.music-view .pager .all span{position:relative;isolation:isolate}
.music-view .pager b{width:fit-content}
.music-view .music-brand::before,.music-header nav a:not([aria-current])::before,.music-view .pager b::before,.music-view .pager .all span::before{content:"";position:absolute;left:-6px;right:-8px;top:50%;height:1.45em;z-index:-1;transform:translateY(-48%) rotate(-2.5deg) skewX(-12deg);background:var(--hl);opacity:.78;mix-blend-mode:multiply;-webkit-mask:var(--swipe) center/100% 100% no-repeat;mask:var(--swipe) center/100% 100% no-repeat;pointer-events:none;clip-path:inset(0 100% 0 0);transition:clip-path .28s ease-out}
.music-view .music-brand:hover::before,.music-header nav a:hover::before,.music-view .pager a:hover b::before,.music-view .pager .all:hover span::before,.music-view .music-brand:focus-visible::before,.music-header nav a:focus-visible::before{clip-path:inset(0 0 0 0)}
.music-header nav a:hover{text-decoration:none}
.music-view .pager a:hover{color:#000}
@media (hover:none){.music-view .music-brand::before,.music-header nav a:not([aria-current])::before,.music-view .pager b::before,.music-view .pager .all span::before{display:none}}
/* House color: the same hover swipe in People yellow on the Portfolio, About and Home pages and the phone menu. */
:root{--hl:#ffe94d}
.site-header .pages a,.splash a,.about-page .pager .all span,.menu a{position:relative;isolation:isolate}
.site-header .pages a::before,.splash a::before,.about-page .pager .all span::before,.menu a::before{content:"";position:absolute;left:-6px;right:-8px;top:50%;height:1.45em;z-index:-1;transform:translateY(-48%) rotate(-2.5deg) skewX(-12deg);background:var(--hl);opacity:.78;mix-blend-mode:multiply;-webkit-mask:var(--swipe) center/100% 100% no-repeat;mask:var(--swipe) center/100% 100% no-repeat;pointer-events:none;clip-path:inset(0 100% 0 0);transition:clip-path .28s ease-out}
.site-header .pages a:hover::before,.splash a:hover::before,.about-page .pager .all:hover span::before,.menu a:hover::before,.site-header .pages a:focus-visible::before,.splash a:focus-visible::before,.menu a:focus-visible::before{clip-path:inset(0 0 0 0)}
.site-header .pages a:hover{color:#000}
/* On photos, white text can't sit on translucent yellow: the swipe goes solid and the text turns black. */
.splash a::before,.about-page .site-header .pages a::before,.about-page .pager .all span::before{opacity:1;mix-blend-mode:normal}
.about-page .pager .all span::before,.music-view .pager .all span::before{height:1.5em;transform:translateY(-62%) rotate(-2.5deg) skewX(-12deg)}
.splash a:hover,.about-page .site-header .pages a:hover,.about-page .pager .all:hover{color:#111!important}
@media (hover:none){.site-header .pages a::before,.splash a::before,.about-page .pager .all span::before,.menu a::before{display:none}}
/* Phones: the current gallery leaves the header menu; the swipe moves to the centered gallery title. */
@media (max-width:700px){
  .music-view .music-header nav{flex-wrap:nowrap;gap:12px}
  .music-view .music-header nav a[aria-current]{display:none}
  .music-view .music-header nav a{font-size:10.5px;white-space:nowrap}
  .music-view .music-header{align-items:center}
  .music-view .music-brand{flex-shrink:1;min-width:0}
  .music-view .page-header h1{display:inline-block;position:relative;isolation:isolate;padding-inline:.15em}
  .music-view .page-header h1::before{content:"";position:absolute;left:-.25em;right:-.3em;top:50%;height:1.15em;z-index:-1;transform:translateY(-48%) rotate(-2.5deg) skewX(-12deg);background:var(--hl);opacity:.78;mix-blend-mode:multiply;-webkit-mask:var(--swipe) center/100% 100% no-repeat;mask:var(--swipe) center/100% 100% no-repeat;pointer-events:none}
}
@media (max-width:380px){.music-view .music-header nav{gap:9px}.music-view .music-header nav a{font-size:10px}.music-view .music-brand{font-size:16px}}
.music-view .page-header{width:65%;margin:auto;padding:0 0 10px;text-align:left}
.music-view .page-header h1{font-size:26px;line-height:1.2;text-transform:none;letter-spacing:.04em}
.music-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.music-grid button{display:block;width:100%;aspect-ratio:4/3;border:0;padding:0;background:#eee;cursor:zoom-in;overflow:hidden}
.music-grid img{width:100%;height:100%;object-fit:cover;transition:opacity .2s}
.music-grid button:hover img{opacity:.9}
.music-view .music-bottom{padding:0 var(--gutter)}
@media(max-width:1000px){.music-header nav{gap:16px}.music-brand{font-size:18px}.music-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:700px){.music-view .music-header{padding:22px 20px;align-items:flex-start;gap:20px}.music-header nav{gap:12px;flex-wrap:wrap;justify-content:flex-end}.music-brand{max-width:150px;font-size:18px}.music-view .page-header{width:auto;margin:0 20px;padding:8px 0 16px}.music-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:420px){.music-header nav a{font-size:10px}.music-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}


/* Portrait previews favor faces; individual Music focal points override this. */
.music-grid img{object-position:50% 20%}
/* Per-photo focal points keep performers in the preview crop. */
.music-grid img[src="img/music-11.jpg"]{object-position:50% 0%}
.music-grid img[src="img/music-12.jpg"]{object-position:50% 15%}
.music-grid img[src="img/music-15.jpg"]{object-position:50% 10%}
.music-grid img[src="img/music-18.jpg"]{object-position:50% 0%}
.music-grid img[src="img/music-21.jpg"]{object-position:50% 10%}
.music-grid img[src="img/music-03.jpg"]{object-position:50% 20%}
.music-grid img[src="img/music-05.jpg"]{object-position:50% 15%}
.music-grid img[src="img/music-06.jpg"]{object-position:50% 0%}
.music-grid img[src="img/music-08.jpg"]{object-position:50% 0%}
.music-grid img[src="img/music-09.jpg"]{object-position:50% 10%}
.music-grid img[src="img/sports-12.jpg"]{object-position:50% 70%}

/* Give the Music collection breathing room and a centered title. */
.music-view .page-header{width:100%;padding:20px 24px 32px;text-align:center}
.music-grid{margin-inline:clamp(20px,4vw,80px)}
@media(max-width:700px){
  .music-view .page-header{width:100%;margin:0;padding:16px 20px 26px;text-align:center}
  .music-grid{margin-inline:16px}
}

/* Fit to the window: on tablets and up, each page's grid is sized so the whole page,
   header to footer, fits the viewport height. Phones keep the scrolling layout. */
:root{--vh:100vh;--swipe:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 40%22 preserveAspectRatio=%22none%22%3E%3Cpath d=%22M4 9 C18 6 40 7 62 6 C90 5 118 7 146 5 C166 4 184 6 195 8 C198 12 196 15 198 19 C196 24 199 28 196 33 C182 35 160 34 138 35 C110 36 84 34 58 35 C38 36 20 35 6 33 C3 29 5 25 2 21 C4 17 1 13 4 9 Z%22/%3E%3Cpath d=%22M8 32 C40 34 90 33 130 34 C160 35 182 34 194 32 L194 34 C180 36 150 37 120 36 C80 36 40 36 10 35 Z%22 opacity=%22.6%22/%3E%3C/svg%3E")}
@supports (height:100svh){:root{--vh:100svh}}
.site-footer{padding-block:clamp(20px,4vh,60px) clamp(14px,2.4vh,22px)}
@media (min-width:701px){
  .site-header{padding-bottom:clamp(16px,3.5vh,60px)}
  .masthead{font-size:clamp(28px,min(4.9vw,7vh),70px);padding-bottom:clamp(14px,3vh,40px)}
  .covers{--ar:1.306;--chrome:calc(136px + 22vh);width:min(100%,calc((var(--vh) - var(--chrome,0px)) * var(--ar)));margin-inline:auto}

function postmark([city, region, zip, intl, x, y, rot, size, ink, cancel], i){
  const bars = cancel ? `<g class="pm-bars">${[0,1,2,3,4].map(k => `<path d="M118 ${40+k*10} q12 -6 24 0 t24 0 t24 0 t24 0"/>`).join('')}</g>` : '';

// Passport entry stamp: boxed or oval, ENTRY / ARRIVED, city, country, postal code and a plane.
function passport([city, region, zip, intl, x, y, rot, size, ink], i){
  const oval = i % 2;

  const label = ["ENTRY","ARRIVED","ADMITTED","IMMIGRATION"][i % 4];
  return `<svg class="pm pm-pp pm-${ink}" viewBox="0 0 160 100" style="left:${x}%;top:${y}%;--r:${rot}deg;--s:${size}">
    <g filter="url(#pm-rough)">${frame}
    <text x="80" y="${oval?30:28}" font-size="10" text-anchor="middle" letter-spacing="3">${label}</text>
    <text x="80" y="54" font-size="${fitText(city,oval?88:110,18)}" text-anchor="middle">${city}</text>

    <text x="80" y="${oval?84:83}" font-size="10" text-anchor="middle">✈ ${zip}</text></g></svg>`;
}

}

function startLiveCovers(){
  stopLiveCovers();

    return { el: c, list, n: 0, busy: false };
  });
  let last = null;
  liveTimer = setInterval(() => {
    if (document.hidden) return;
    const pool = tiles.filter(t => t !== last && !t.busy && !t.el.matches(':hover'));

    const t = pool[Math.floor(Math.random() * pool.length)]; last = t;

    back.onload = () => { back.classList.add('on'); front.classList.remove('on'); setTimeout(() => t.busy = false, 1500); };
    back.onerror = () => { t.busy = false; };
    back.src = t.list[t.n++ % t.list.length];
  }, 1200);
}

function pager(current){
  const i = GALLERIES.findIndex(p => p.slug === current);
  const all = `<a class="all" href="#work"><span>ALL GALLERIES</span></a>`;
  if (i < 0) return `<nav class="pager" aria-label="Galleries"><span></span>${all}<span></span></nav>`;
  const prev = GALLERIES[(i - 1 + GALLERIES.length) % GALLERIES.length], next = GALLERIES[(i + 1) % GALLERIES.length];
  return `<nav class="pager" aria-label="Galleries">
    <a class="pv" href="#${prev.slug}"><small>‹ PREVIOUS</small><b>${prev.title}</b></a>
    ${all}
    <a class="nx" href="#${next.slug}"><small>NEXT ›</small><b>${next.title}</b></a></nav>`;
}
document.getElementById('menugal').innerHTML = GALLERIES.map(p => `<a href="#${p.slug}">${nice(p.title)}</a>`).join('');

let cur = [], idx = 0;
let curSlug = '';
function galleryView(p){
  const photos = PHOTOS[p.key] || []; cur = photos; curSlug = p.slug;
  document.title = p.title.charAt(0) + p.title.slice(1).toLowerCase() + " | André";
  if (photos.length) {
    // Shuffle display indices; keep the source indices stable for photo links.
    const order = photos.map((_, k) => k);
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    app.innerHTML = `<div class="view music-view" data-g="${p.key}">
      <header class="music-header"><a class="music-brand" href="#work">${NAME}</a>
        <nav aria-label="Site"><a href="#work">PORTFOLIO</a><a href="#${p.slug}" aria-current="page">${p.title}</a><a href="#about-me">ABOUT</a><a href="mailto:andreograves@gmail.com">CONNECT</a></nav>
      </header>
      <div class="page-header"><h1>${nice(p.title)}</h1></div>
      <div class="music-grid">${order.map((k,position) => { const f = photos[k]; return `<button data-i="${k}" aria-label="Open ${nice(p.title)} photo ${k+1}"><img src="img/${f[0]}" width="${f[1]}" height="${f[2]}" alt="${nice(p.title)}, photo ${k+1}" loading="${position<4?'eager':'lazy'}"></button>`; }).join('')}</div>
      <div class="music-bottom">${pager(p.slug)}${footer()}</div></div>`;
    app.querySelectorAll('.music-grid button').forEach(b => b.onclick = () => openLb(+b.dataset.i));
    return;
  }
  app.innerHTML = `<div class="view">${header('')}<div class="wrap">
    <div class="page-header"><h1>${p.title}</h1></div>
    <div class="rows" id="rows"></div>
    ${pager(p.slug)}
    ${footer()}</div></div>`;
  layoutRows();
}

// Justified rows with no gaps, like the live "media collection" module.
function layoutRows(){
  const box = document.getElementById('rows'); if (!box) return;
  const W = box.clientWidth, target = Math.max(160, Math.min(300, W * 0.2)), title = app.querySelector('h1').textContent;
  // Pick a row count from the target height, then fill every row edge to edge.
  const total = cur.reduce((s, f) => s + f[1]/f[2], 0), n = Math.max(1, Math.round(total * target / W)), per = total / n;
  const rows = []; let row = [], sum = 0, done = 0;
  cur.forEach((f, k) => { const ar = f[1]/f[2];
    if (row.length && rows.length < n - 1 && done + sum + ar/2 > per * (rows.length + 1)){ rows.push([row, W / sum]); done += sum; row = []; sum = 0; }
    row.push(k); sum += ar; });
  if (row.length) rows.push([row, W / sum]);
  box.innerHTML = rows.map(([r, h]) => `<div class="row">${r.map(k => { const f = cur[k], w = h * f[1]/f[2];
    return `<button data-i="${k}" style="width:${(w/W*100).toFixed(4)}%;height:${Math.round(h)}px" aria-label="Open photo ${k+1}"><img src="img/${f[0]}" alt="${title}, photo ${k+1}" loading="lazy"></button>`; }).join('')}</div>`).join('');
  box.querySelectorAll('button').forEach(b => b.onclick = () => openLb(+b.dataset.i));
}
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(layoutRows, 120); });

function aboutView(){
  document.title = "About | André";
  app.innerHTML = `<div class="view about-page on-photo">${postmarks()}${header('about')}<div class="wrap">
    <div class="about-text"><h1>${NAME}</h1>
    <p>Currently residing in the Pacific Northwest, but always on the GO. Pointing my lens at everything along the way...</p>
    <p>Home base is Seattle, but the camera goes wherever I do: trumpet players and festival crowds in New Orleans, comics under the lights at The Comedy Store, skaters in the Venice bowl, eagles, gorillas and the occasional total solar eclipse. It's all about the adventure, the people I meet along the way, and getting a little better every time I press the shutter. Practice makes…practice.</p></div>
    ${pager('about-me')}
    ${footer()}</div></div>`;
}

function route(){
  const slug = location.hash.replace(/^#\/?/, '');
  lb.hidden = true; menu.hidden = true; stopLiveCovers(); curSlug = '';
  // A photo link looks like #001-people-5: the gallery, then the photo number.
  const m = slug.match(/^(.+)-(\d+)$/), pm = m && PAGES.find(x => x.slug === m[1] && x.key !== 'about');
  if (pm) {
    galleryView(pm); window.scrollTo(0, 0);
    const n = +m[2];
    if (n >= 1 && n <= cur.length) openLb(n - 1); else setHash(pm.slug);
    return;
  }
  const p = PAGES.find(x => x.slug === slug);
  if (slug === 'work') { workView(); startLiveCovers(); }
  else if (p && p.key === 'about') aboutView();
  else if (p) galleryView(p);
  else splashView();
  window.scrollTo(0, 0);
  track();
}

// Visitor stats (GoatCounter). Loads only on andregraves.com, so previews and local tests are never counted.
// The site changes pages without reloading, so each view is sent by hand: /work, /001-people, /001-people-5 …
const GC_ON = /(^|\.)andregraves\.com$/.test(location.hostname), gcQueue = [];
function track(){
  if (!GC_ON) return;
  const hit = { path: '/' + location.hash.replace(/^#\/?/, ''), title: document.title };
  if (window.goatcounter && window.goatcounter.count) window.goatcounter.count(hit); else gcQueue.push(hit);
}
if (GC_ON) {
  const s = document.createElement('script');
  s.async = true; s.src = 'https://gc.zgo.at/count.js';
  s.dataset.goatcounter = 'https://andreograves.goatcounter.com/count';
  s.dataset.goatcounterSettings = '{"no_onload": true}';
  s.onload = () => { if (window.goatcounter && window.goatcounter.count) gcQueue.splice(0).forEach(h => window.goatcounter.count(h)); };
  document.head.appendChild(s);
}

// Mobile menu
const menu = document.getElementById('menu');
app.addEventListener('click', e => { if (e.target.closest('[data-menu]')) { menu.hidden = false; document.getElementById('menux').focus(); } });
document.getElementById('menux').onclick = () => menu.hidden = true;

// Lightbox
const lb = document.getElementById('lb'), lbimg = document.getElementById('lbimg'), lbc = document.getElementById('lbc');
// The address follows the photo on screen, without reloading the page or adding history entries.
function setHash(h){ try { history.replaceState(null, '', '#' + h); } catch (e) {} }
const lburl = document.getElementById('lburl'), lbcopy = document.getElementById('lbcopy');
function show(){
  const f = cur[idx]; lbimg.src = 'img/' + f[0]; lbimg.alt = 'Photo ' + (idx+1); lbc.textContent = (idx+1) + ' / ' + cur.length;
  if (curSlug) { setHash(curSlug + '-' + (idx+1)); track(); }
  lburl.hidden = true; lbcopy.textContent = 'COPY LINK';
}
function openLb(i){ idx = i; show(); lb.hidden = false; document.getElementById('lbx').focus(); }
function closeLb(){ if (lb.hidden) return; lb.hidden = true; if (curSlug) setHash(curSlug); }
// On andregraves.com copy the page address; anywhere else (the artifact preview), copy the public andregraves.com link.
function photoLink(){
  const own = /(^|\.)andregraves\.com$/.test(location.hostname);
  return (own ? location.origin + location.pathname : 'https://andregraves.com/') + '#' + curSlug + '-' + (idx+1);
}
lbcopy.onclick = () => {
  const url = photoLink();
  const fallback = () => { lburl.value = url; lburl.hidden = false; lburl.focus(); lburl.select(); lbcopy.textContent = 'COPY THIS LINK'; };
  try { navigator.clipboard.writeText(url).then(() => { lbcopy.textContent = 'LINK COPIED'; }, fallback); } catch (e) { fallback(); }
};
function step(d){ idx = (idx + d + cur.length) % cur.length; show(); }
document.getElementById('lbx').onclick = closeLb;
document.getElementById('lbp').onclick = () => step(-1);
document.getElementById('lbn').onclick = () => step(1);
lb.addEventListener('click', e => { if (e.target === lb) closeLb(); else if (e.target === lbimg) step(1); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeLb(); menu.hidden = true; }
  if (lb.hidden) return;
  if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1);
});
let tx = null;
lb.addEventListener('touchstart', e => tx = e.touches[0].clientX, {passive:true});
lb.addEventListener('touchend', e => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 40) step(dx < 0 ? 1 : -1); tx = null; });

window.addEventListener('hashchange', route);
route();
</script>
