<style>
/* Mirrors the live Adobe Portfolio site (theme "Jess"): white walls, distressed typewriter type,
   edge-to-edge grayscale covers, justified photo rows, round social buttons. Single light look by design. */
:root{
  --bg:#fff;        /* page */
  --ink:#111;       /* page titles */
  --masthead:#222;  /* masthead line 1 */
  --ghost:#8d8d8d;  /* masthead line 2 */
  --nav:#aaa;       /* nav links at rest */
  --chip:#eee;      /* social button fill */
  --chip-ink:#6b6b6b;
  --sub:#c0c6cc;    /* splash subtitle */
  --white:#fff;
  /* Live site uses Adobe Fonts "Typeka"; Special Elite is the closest free face. */
  --type:'Typeka','Special Elite','American Typewriter','Courier New',Courier,monospace;
  --gutter:48px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;overflow-x:hidden;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--type);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid currentColor;outline-offset:3px}
@media (max-width:768px){:root{--gutter:16px}}

.view{animation:fade .35s ease}
@keyframes fade{from{opacity:.001}to{opacity:1}}

/* Splash (live homepage) */
.splash{position:relative;min-height:100svh;display:grid;place-items:center;text-align:center;background:#000 url(img/splash.jpg) 0% 50%/cover no-repeat;color:var(--white);
  padding-block:70px 180px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.splash h1{margin:0;font-weight:400;font-size:clamp(34px,4.2vw,60px);line-height:1.1;letter-spacing:.01em}
.splash a{display:inline-block;margin-top:.15em;font-size:clamp(18px,1.95vw,28px);color:var(--sub);transition:color .2s}
.splash a:hover{color:var(--white)}

/* Header / nav */
.site-header{position:relative;z-index:5;padding-block:14px 60px;text-align:center}
.pages{display:flex;justify-content:center;gap:35px}
.pages a{font-size:16px;line-height:16px;text-transform:uppercase;color:var(--nav);transition:color .2s}
.pages a:hover,.pages a.active{color:#000}
.burger{display:none}
.menu{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px}
.menu a{font-size:28px;text-transform:uppercase;color:#000}
.menu .gal{display:grid;grid-template-columns:1fr 1fr;gap:14px 32px;text-align:center}
.menu .gal a{font-size:18px;color:#555}
.menu .close{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));background:none;border:0;font-size:40px;line-height:1;cursor:pointer;color:#000}
@media (max-width:768px){
  .site-header{padding-block:20px 40px;text-align:right;padding-right:max(16px,env(safe-area-inset-right,0px))}
  .pages{display:none}
  .burger{display:inline-flex;flex-direction:column;gap:6px;background:none;border:0;padding:6px;cursor:pointer}
  .burger i{display:block;width:26px;height:2px;background:#000}
  .on-photo .burger i{background:var(--white)}
}

.wrap{padding-left:max(var(--gutter),env(safe-area-inset-left,0px));padding-right:max(var(--gutter),env(safe-area-inset-right,0px))}

/* Masthead: three offset lines, as on the live Portfolio page */
.masthead{width:min(800px,100%);margin:0 auto;padding-bottom:40px;font-size:clamp(28px,4.9vw,70px);line-height:.72}
.masthead div{white-space:nowrap}
.masthead .m1{text-align:right;color:var(--masthead)}
.masthead .m2{text-align:left;color:var(--ghost);margin-top:.05em}
.masthead .m3{text-align:center;color:#000;margin-top:-.05em}
@media (max-width:768px){.masthead{padding-bottom:50px}}

/* Cover grid */
.covers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
@media (max-width:768px){.covers{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:540px){.covers{grid-template-columns:1fr}}
.cover{position:relative;display:block;aspect-ratio:457/350;max-width:100%;overflow:hidden;background:#222}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1);opacity:0;transition:opacity 1.4s ease,filter .6s ease}
.cover img.on{opacity:1}
.cover:hover img,.cover:focus-visible img{filter:grayscale(0)}
.cover::after{content:"";position:absolute;inset:0;background:#000;opacity:0;transition:opacity .3s}
.cover span{position:absolute;inset:0;z-index:1;display:grid;place-items:center;text-align:center;padding:0 10%;color:var(--white);font-size:clamp(34px,4.9vw,70px);line-height:1.05;opacity:0;transition:opacity .15s}
.cover:hover::after,.cover:focus-visible::after{opacity:.22}
.cover:hover span,.cover:focus-visible span{opacity:1}

/* Previous / all / next, under each gallery */
.pager{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:16px;padding-block:24px 0}
.pager a{display:flex;flex-direction:column;gap:6px;color:#000;transition:color .2s}
.pager a:hover{color:var(--nav)}
.pager small{font-size:12px;letter-spacing:.14em;color:var(--nav)}
.pager b{font-weight:400;font-size:clamp(20px,2vw,28px);line-height:1}
.pager .all{align-items:center;font-size:14px;letter-spacing:.1em;padding-bottom:4px}
.pager .nx{align-items:flex-end;text-align:right}
.on-photo .pager a{color:var(--white)}
.on-photo .pager a:hover{color:var(--sub)}
@media (max-width:540px){.pager{grid-template-columns:1fr 1fr}.pager .all{grid-column:1/-1;order:3;padding-top:20px}}

/* Gallery page */
.page-header{width:min(800px,100%);margin:0 auto;padding-block:20px 70px;text-align:center}
.page-header h1{margin:0;font-weight:400;font-size:clamp(40px,4.2vw,60px);line-height:1.07;color:var(--ink);text-wrap:balance}
@media (max-width:768px){.page-header{padding-block:10px 40px}}
.rows{padding-bottom:16px}
.row{display:flex}
.row button{display:block;flex:0 0 auto;padding:0;border:0;background:#eee;cursor:zoom-in;overflow:hidden}
.row img{width:100%;height:100%;object-fit:cover}

/* About page */
.about-page{position:relative;z-index:0;min-height:100svh;color:var(--white)}
.about-page::before{content:"";position:fixed;inset:0;z-index:-1;background:#222 url(img/about-bg.jpg) center/cover no-repeat}
.about-page .site-header .pages a{color:rgba(255,255,255,.7)}
.about-page .site-header .pages a:hover,.about-page .site-header .pages a.active{color:var(--white)}
.about-text{width:min(800px,100%);margin-left:auto;margin-right:max(0px,calc(50vw - 670px));padding-block:100px 200px}
.about-text h1{margin:0 0 150px;font-weight:400;font-size:clamp(44px,6.4vw,92px);line-height:1}
.about-text p{margin:0;font-size:clamp(18px,1.55vw,22px);line-height:1.38;max-width:34em;text-shadow:0 1px 8px rgba(0,0,0,.35)}
@media (max-width:768px){.about-text{padding-block:40px 120px}.about-text h1{margin-bottom:60px}}

/* ---------- Layout previews (#work-mosaic, #work-index, #work-chapters) ---------- */
.switcher{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:4px;max-width:calc(100vw - 24px);overflow-x:auto;padding:6px;background:#111;border-radius:999px;box-shadow:0 8px 24px -8px rgba(0,0,0,.5)}
.switcher b{font-weight:400;font-size:11px;letter-spacing:.16em;color:#888;padding:0 8px 0 10px;white-space:nowrap}
.switcher a{font-size:12px;letter-spacing:.1em;color:#ddd;padding:7px 12px;border-radius:999px;white-space:nowrap;transition:background .2s,color .2s}
.switcher a:hover{color:#fff;background:#2a2a2a}
.switcher a.active{background:#fff;color:#000}
.has-switcher .site-footer{padding-bottom:90px}
@media (max-width:540px){.switcher b{display:none}.switcher a{font-size:11px;padding:7px 9px;letter-spacing:.06em}}

/* 3. Mosaic */
.mosaic{display:grid;gap:6px;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:clamp(150px,17vw,250px);
  grid-template-areas:"people people places about" "people people things about" "music music art sports" "birds animals animals sports"}
.mosaic .cover{aspect-ratio:auto;height:100%}
.mosaic .cover span{font-size:clamp(28px,3.6vw,56px)}
.mosaic .a-people span{font-size:clamp(40px,5.6vw,90px)}
@media (max-width:768px){.mosaic{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:clamp(130px,34vw,220px);
  grid-template-areas:"people people" "places things" "about music" "about art" "sports birds" "animals animals"}}

/* 4. Typed index */
.tindex{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(24px,4vw,64px);align-items:start;padding-top:10px}
.tlist{list-style:none;margin:0;padding:0}
.tlist a{display:grid;grid-template-columns:3.2em minmax(0,auto) 1fr auto;align-items:baseline;gap:12px;padding-block:6px;color:#000;transition:color .25s}
.tlist small{font-size:13px;letter-spacing:.1em;color:var(--nav)}
.tlist .t{font-size:clamp(30px,4.6vw,66px);line-height:1.05;white-space:nowrap}
.tlist .lead{border-bottom:2px dotted #c9c9c9;transform:translateY(-.35em)}
.tlist .ct{font-size:15px;color:var(--nav);font-variant-numeric:tabular-nums}
.tlist .th{display:none}
.tlist:hover a,.tlist:focus-within a{color:#c4c4c4}
.tlist a:hover,.tlist a:focus-visible{color:#000}
.tprev{position:sticky;top:24px;aspect-ratio:4/5;max-width:100%;overflow:hidden;background:#eee}
.tprev img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1);opacity:0;transition:opacity .45s ease}
.tprev img.on{opacity:1}
.tprev figcaption{position:absolute;left:14px;bottom:12px;color:#fff;font-size:13px;letter-spacing:.14em;text-shadow:0 1px 6px rgba(0,0,0,.6)}
@media (max-width:860px){
  .tindex{grid-template-columns:1fr}.tprev{display:none}
  .tlist a{grid-template-columns:64px 2.6em minmax(0,1fr) auto;align-items:center;gap:12px;padding-block:8px}
  .tlist .th{display:block;width:64px;height:48px;object-fit:cover;filter:grayscale(1)}
  .tlist .lead{display:none}.tlist .t{font-size:clamp(24px,7vw,40px)}
}

/* 5. Chapters */
html.snap{scroll-snap-type:y proximity}
.chapters-page .site-header{position:absolute;left:0;right:0;top:0}
.chapters-page .site-header .pages a{color:rgba(255,255,255,.75)}
.chapters-page .site-header .pages a:hover,.chapters-page .site-header .pages a.active{color:#fff}
.chapter{position:relative;min-height:100svh;display:flex;align-items:flex-end;scroll-snap-align:start;overflow:hidden;background:#111;color:#fff}
.chapter img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1);transform:scale(1.04);transition:transform 6s ease,filter 1.2s ease}
.chapter.seen img{transform:scale(1)}
.chapter::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15) 30%,rgba(0,0,0,.7))}
.chapter .in{position:relative;z-index:1;width:100%;padding-block:0 clamp(48px,11vh,110px);padding-left:max(var(--gutter),env(safe-area-inset-left,0px));padding-right:max(var(--gutter),env(safe-area-inset-right,0px));
  display:flex;justify-content:space-between;align-items:flex-end;gap:16px 32px;flex-wrap:wrap}
.chapter small{display:block;font-size:13px;letter-spacing:.16em;color:#bbb;margin-bottom:10px}
.chapter h2{margin:0;font-weight:400;font-size:clamp(48px,10vw,150px);line-height:.95;min-height:.95em}
.chapter .go{font-size:15px;letter-spacing:.12em;border-bottom:1px solid rgba(255,255,255,.6);padding-bottom:3px;white-space:nowrap}
.chapter .go:hover{border-color:#fff}
.chapter .caret{display:inline-block;width:.5em;border-bottom:.06em solid currentColor;margin-left:.04em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.chapters-end{padding-block:10px 0}

/* Footer */
.site-footer{padding-block:60px 22px;display:flex;justify-content:center;gap:15px}
.site-footer a{display:grid;place-items:center;width:45px;height:45px;border-radius:50%;background:var(--chip);color:var(--chip-ink);transition:background .2s,color .2s}
.site-footer a:hover{background:#ddd;color:#000}
.site-footer svg{width:30px;height:24px;fill:currentColor}

/* Lightbox: white, as on the live site */
.lb{position:fixed;inset:0;z-index:60;background:rgba(255,255,255,.96);display:flex;align-items:center;justify-content:center;
  padding:calc(50px + env(safe-area-inset-top,0px)) max(56px,env(safe-area-inset-right,0px)) calc(50px + env(safe-area-inset-bottom,0px)) max(56px,env(safe-area-inset-left,0px))}
.lb img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
.lb button{position:absolute;background:none;border:0;color:#111;font-size:34px;line-height:1;cursor:pointer;padding:12px 16px;font-family:system-ui,sans-serif;font-weight:200}
.lb .x{top:calc(4px + env(safe-area-inset-top,0px));right:max(4px,env(safe-area-inset-right,0px))}
.lb .pv{left:max(0px,env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%)}
.lb .nx{right:max(0px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%)}
.lb .ct{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:13px;color:#888}
@media (max-width:540px){.lb{padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}.lb .pv,.lb .nx{top:auto;bottom:calc(2px + env(safe-area-inset-bottom,0px));transform:none}}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const SOCIAL = [
  ["https://www.linkedin.com/in/tcoa/","LinkedIn","linkedin"],

const NAME = "ANDRÉ O. GRAVES";
const app = document.getElementById('app');

function header(active){
  return `<header class="site-header"><nav class="pages" aria-label="Site">
    <a href="#home"${active==='home'?' class="active"':''}>Home</a>
    <a href="#work"${active==='work'?' class="active"':''}>Portfolio</a>

  </nav><button class="burger" data-menu aria-label="Open menu"><i></i><i></i><i></i></button></header>`;
}
const footer = () => `<footer class="site-footer">${SOCIAL.map(([h,l,i]) =>
  `<a href="${h}" target="_blank" rel="noopener" aria-label="${l}" title="${l}"><svg viewBox="0 0 30 24" aria-hidden="true">${ICONS[i]}</svg></a>`).join('')}</footer>`;
const cover = p => `<a class="cover" href="#${p.slug}" data-key="${p.key}" aria-label="${p.title}"><img class="on" src="img/cover-${p.key}.jpg" alt=""><img alt=""><span aria-hidden="true">${p.title}</span></a>`;

// Living covers: every ~1.2s one tile (never the one under the pointer) fades to another photo from its gallery.
let liveTimer = null;
function startLiveCovers(){
  stopLiveCovers();
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const tiles = [...app.querySelectorAll('.cover')].filter(c => (PHOTOS[c.dataset.key] || []).length > 1).map(c => {
    const list = PHOTOS[c.dataset.key].map(f => 'img/' + f[0]);
    for (let i = list.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [list[i], list[j]] = [list[j], list[i]]; }
    return { el: c, list, n: 0, busy: false };
  });
  let last = null;
  liveTimer = setInterval(() => {
    if (document.hidden) return;
    const pool = tiles.filter(t => t !== last && !t.busy && !t.el.matches(':hover'));
    if (!pool.length) return;
    const t = pool[Math.floor(Math.random() * pool.length)]; last = t;
    const [a, b] = t.el.querySelectorAll('img'), front = a.classList.contains('on') ? a : b, back = front === a ? b : a;
    t.busy = true;
    back.onload = () => { back.classList.add('on'); front.classList.remove('on'); setTimeout(() => t.busy = false, 1500); };
    back.onerror = () => { t.busy = false; };
    back.src = t.list[t.n++ % t.list.length];
  }, 1200);
}
function stopLiveCovers(){ clearInterval(liveTimer); liveTimer = null; }

function splashView(){
  document.title = "André O. Graves | Portfolio";
  app.innerHTML = `<section class="splash view"><div>
    <h1>${NAME}</h1>
    <a href="#work">People, Places, Things.</a>

}

const SWITCH = [["work","CURRENT"],["work-mosaic","3 · MOSAIC"],["work-index","4 · INDEX"],["work-chapters","5 · CHAPTERS"]];
const switcher = active => `<nav class="switcher" aria-label="Layout previews"><b>PREVIEW</b>${SWITCH.map(([h,l]) =>
  `<a href="#${h}"${h===active?' class="active" aria-current="page"':''}>${l}</a>`).join('')}</nav>`;
const masthead = () => `<div class="masthead" role="heading" aria-level="1" aria-label="${NAME}">
      <div class="m1" aria-hidden="true">${NAME}</div><div class="m2" aria-hidden="true">${NAME}</div><div class="m3" aria-hidden="true">${NAME}</div></div>`;

    <div class="mosaic">${PAGES.map(p => cover(p).replace('class="cover"', `class="cover a-${p.key}" style="grid-area:${p.key}"`)).join('')}</div>
    ${footer()}</div>${switcher('work-mosaic')}</div>`;
}

function indexView(){
  document.title = "Index preview | André O. Graves";
  const rows = PAGES.filter(p => p.key !== 'about').concat(PAGES.find(p => p.key === 'about'));
  app.innerHTML = `<div class="view has-switcher">${header('work')}<div class="wrap">${masthead()}
    <div class="tindex"><ul class="tlist">${rows.map((p, i) => {
      const n = (PHOTOS[p.key] || []).length;
      return `<li><a href="#${p.slug}" data-key="${p.key}"><img class="th" src="img/cover-${p.key}.jpg" alt=""><small>${p.key === 'about' ? '———' : String(i+1).padStart(3,'0')}</small><span class="t">${p.title}</span><span class="lead"></span><span class="ct">${n || ''}</span></a></li>`;
    }).join('')}</ul>
    <figure class="tprev" aria-hidden="true">${rows.map((p, i) => `<img class="${i ? '' : 'on'}" data-key="${p.key}" src="img/cover-${p.key}.jpg" alt="">`).join('')}<figcaption id="tcap">001 · PEOPLE</figcaption></figure></div>
    ${footer()}</div>${switcher('work-index')}</div>`;
  const imgs = [...app.querySelectorAll('.tprev img')], cap = document.getElementById('tcap');
  app.querySelectorAll('.tlist a').forEach(a => {
    const show = () => { imgs.forEach(im => im.classList.toggle('on', im.dataset.key === a.dataset.key)); cap.textContent = a.querySelector('small').textContent + ' · ' + a.querySelector('.t').textContent; };
    a.addEventListener('mouseenter', show); a.addEventListener('focus', show);
  });
}

let chapterObs = null;
function chaptersView(){
  document.title = "Chapters preview | André O. Graves";
  const rows = PAGES.filter(p => p.key !== 'about').concat(PAGES.find(p => p.key === 'about'));
  app.innerHTML = `<div class="view chapters-page has-switcher">${header('work')}
    ${rows.map((p, i) => `<section class="chapter" aria-label="${nice(p.title)}"><img src="img/cover-${p.key}.jpg" alt="" ${i ? 'loading="lazy"' : ''}>
      <div class="in"><div><small>${p.key === 'about' ? 'ANDRÉ O. GRAVES' : String(i+1).padStart(3,'0') + ' / 008'}</small><h2 data-text="${p.title}">${p.title}</h2></div>
      <a class="go" href="#${p.slug}">${p.key === 'about' ? 'READ MORE →' : 'VIEW ' + (PHOTOS[p.key]||[]).length + ' PHOTOS →'}</a></div></section>`).join('')}
    <div class="wrap chapters-end">${footer()}</div>${switcher('work-chapters')}</div>`;
  document.documentElement.classList.add('snap');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  chapterObs = new IntersectionObserver(entries => entries.forEach(e => {
    if (!e.isIntersecting || e.target.classList.contains('seen')) return;
    e.target.classList.add('seen');
    const h = e.target.querySelector('h2'), text = h.dataset.text;
    if (reduce) return;
    h.textContent = ''; const c = document.createElement('span'); c.className = 'caret'; h.appendChild(c);
    let i = 0; const tick = () => { if (!h.isConnected) return; if (i < text.length){ c.before(text[i++]); setTimeout(tick, 70); } else setTimeout(() => c.remove(), 900); };
    setTimeout(tick, 250);
  }), { threshold: 0.55 });
  app.querySelectorAll('.chapter').forEach(s => chapterObs.observe(s));
}

function workView(){
  document.title = "André O. Graves | Portfolio";
  app.innerHTML = `<div class="view has-switcher">${header('work')}<div class="wrap">
    <div class="masthead" role="heading" aria-level="1" aria-label="${NAME}">
      <div class="m1" aria-hidden="true">${NAME}</div><div class="m2" aria-hidden="true">${NAME}</div><div class="m3" aria-hidden="true">${NAME}</div>

const GALLERIES = PAGES.filter(p => p.key !== 'about');
const nice = s => s.charAt(0) + s.slice(1).toLowerCase();
function pager(current){
  const i = GALLERIES.findIndex(p => p.slug === current);
  const all = `<a class="all" href="#work">ALL GALLERIES</a>`;
  if (i < 0) return `<nav class="pager" aria-label="Galleries"><span></span>${all}<span></span></nav>`;
  const prev = GALLERIES[(i - 1 + GALLERIES.length) % GALLERIES.length], next = GALLERIES[(i + 1) % GALLERIES.length];
  return `<nav class="pager" aria-label="Galleries">
    <a class="pv" href="#${prev.slug}"><small>‹ PREVIOUS</small><b>${prev.title}</b></a>
    ${all}
    <a class="nx" href="#${next.slug}"><small>NEXT ›</small><b>${next.title}</b></a></nav>`;
}
document.getElementById('menugal').innerHTML = GALLERIES.map(p => `<a href="#${p.slug}">${nice(p.title)}</a>`).join('');

let cur = [], idx = 0;
function galleryView(p){
  const photos = PHOTOS[p.key] || []; cur = photos;
  document.title = p.title.charAt(0) + p.title.slice(1).toLowerCase() + " | André O. Graves";
  app.innerHTML = `<div class="view">${header('')}<div class="wrap">
    <div class="page-header"><h1>${p.title}</h1></div>
    <div class="rows" id="rows"></div>
    ${pager(p.slug)}
    ${footer()}</div></div>`;
  layoutRows();
}

// Justified rows with no gaps, like the live "media collection" module.
function layoutRows(){
  const box = document.getElementById('rows'); if (!box) return;
  const W = box.clientWidth, target = Math.max(160, Math.min(300, W * 0.2)), title = app.querySelector('h1').textContent;
  // Pick a row count from the target height, then fill every row edge to edge.
  const total = cur.reduce((s, f) => s + f[1]/f[2], 0), n = Math.max(1, Math.round(total * target / W)), per = total / n;
  const rows = []; let row = [], sum = 0, done = 0;
  cur.forEach((f, k) => { const ar = f[1]/f[2];
    if (row.length && rows.length < n - 1 && done + sum + ar/2 > per * (rows.length + 1)){ rows.push([row, W / sum]); done += sum; row = []; sum = 0; }
    row.push(k); sum += ar; });
  if (row.length) rows.push([row, W / sum]);
  box.innerHTML = rows.map(([r, h]) => `<div class="row">${r.map(k => { const f = cur[k], w = h * f[1]/f[2];
    return `<button data-i="${k}" style="width:${(w/W*100).toFixed(4)}%;height:${Math.round(h)}px" aria-label="Open photo ${k+1}"><img src="img/${f[0]}" alt="${title}, photo ${k+1}" loading="lazy"></button>`; }).join('')}</div>`).join('');
  box.querySelectorAll('button').forEach(b => b.onclick = () => openLb(+b.dataset.i));
}
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(layoutRows, 120); });

function aboutView(){
  document.title = "About | André O. Graves";
  app.innerHTML = `<div class="view about-page on-photo">${header('about')}<div class="wrap">
    <div class="about-text"><h1>${NAME}</h1>
    <p>Currently residing in the Pacific Northwest, but always on the GO. And pointing my lens at everything along the way...</p></div>
    ${pager('about-me')}
    ${footer()}</div></div>`;
}

function route(){
  const slug = location.hash.replace(/^#\/?/, '');
  closeLb(); menu.hidden = true; stopLiveCovers();
  document.documentElement.classList.remove('snap'); if (chapterObs) { chapterObs.disconnect(); chapterObs = null; }
  const p = PAGES.find(x => x.slug === slug);
  if (slug === 'work') { workView(); startLiveCovers(); }
  else if (slug === 'work-mosaic') { mosaicView(); startLiveCovers(); }
  else if (slug === 'work-index') indexView();
  else if (slug === 'work-chapters') chaptersView();
  else if (p && p.key === 'about') aboutView();
  else if (p) galleryView(p);
  else splashView();
  window.scrollTo(0, 0);
}

// Mobile menu
const menu = document.getElementById('menu');
app.addEventListener('click', e => { if (e.target.closest('[data-menu]')) { menu.hidden = false; document.getElementById('menux').focus(); } });
document.getElementById('menux').onclick = () => menu.hidden = true;

// Lightbox
const lb = document.getElementById('lb'), lbimg = document.getElementById('lbimg'), lbc = document.getElementById('lbc');
function show(){ const f = cur[idx]; lbimg.src = 'img/' + f[0]; lbimg.alt = 'Photo ' + (idx+1); lbc.textContent = (idx+1) + ' / ' + cur.length; }
function openLb(i){ idx = i; show(); lb.hidden = false; document.getElementById('lbx').focus(); }
function closeLb(){ lb.hidden = true; }
function step(d){ idx = (idx + d + cur.length) % cur.length; show(); }
document.getElementById('lbx').onclick = closeLb;
document.getElementById('lbp').onclick = () => step(-1);
document.getElementById('lbn').onclick = () => step(1);
lb.addEventListener('click', e => { if (e.target === lb) closeLb(); else if (e.target === lbimg) step(1); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeLb(); menu.hidden = true; }
  if (lb.hidden) return;
  if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1);
});
let tx = null;
lb.addEventListener('touchstart', e => tx = e.touches[0].clientX, {passive:true});
lb.addEventListener('touchend', e => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 40) step(dx < 0 ? 1 : -1); tx = null; });

window.addEventListener('hashchange', route);
route();
</script>
